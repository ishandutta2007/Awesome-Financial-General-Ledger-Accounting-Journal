<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35"/>
    </pattern>

    <!-- Animations -->
    <style>
      .pulse-slow {
        animation: pulse 8s ease-in-out infinite alternate;
      }
      .pulse-fast {
        animation: pulse 5s ease-in-out infinite alternate;
      }
      .flow-line {
        stroke-dasharray: 8, 8;
        animation: dash 25s linear infinite;
      }
      .fade-pill {
        animation: floatPill 6s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { transform: scale(1) translate(0px, 0px); opacity: 0.2; }
        50% { transform: scale(1.15) translate(20px, 10px); opacity: 0.35; }
        100% { transform: scale(0.95) translate(-15px, 20px); opacity: 0.25; }
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -1000;
        }
      }
      @keyframes floatPill {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
      }
      .code-font {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Subtle Dynamic Background Glowing Orbs -->
  <circle cx="180" cy="100" r="220" fill="url(#glowGrad1)" class="pulse-slow" />
  <circle cx="1020" cy="300" r="260" fill="url(#glowGrad2)" class="pulse-fast" />

  <!-- Grid Overlay -->
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Dynamic Animated Chart / Ledger Vector Lines in Background -->
  <g opacity="0.3">
    <!-- Financial Balance Curve -->
    <path d="M 0 320 Q 250 200, 500 270 T 900 180 T 1200 230" fill="none" stroke="#10b981" stroke-width="2" class="flow-line" />
    <path d="M 0 360 Q 300 250, 600 310 T 1000 210 T 1200 260" fill="none" stroke="#6366f1" stroke-width="1.5" class="flow-line" />
  </g>

  <!-- Animated Floating Feature Pills (Lower Background Layer) -->
  <g class="fade-pill" opacity="0.85">
    <!-- Pill 1: Double-Entry -->
    <g transform="translate(60, 48)">
      <rect width="185" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <circle cx="20" cy="17" r="5" fill="#10b981"/>
      <text x="34" y="22" class="tag-text" fill="#cbd5e1">Double-Entry Core</text>
    </g>

    <!-- Pill 2: Open Source & API -->
    <g transform="translate(950, 48)">
      <rect width="190" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <circle cx="20" cy="17" r="5" fill="#6366f1"/>
      <text x="34" y="22" class="tag-text" fill="#cbd5e1">SaaS &amp; Self-Hosted</text>
    </g>

    <!-- Pill 3: General Ledger -->
    <g transform="translate(80, 345)">
      <rect width="215" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <circle cx="20" cy="17" r="5" fill="#06b6d4"/>
      <text x="34" y="22" class="tag-text" fill="#cbd5e1">General Ledger &amp; Journal</text>
    </g>

    <!-- Pill 4: Audit Trails -->
    <g transform="translate(930, 345)">
      <rect width="210" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <circle cx="20" cy="17" r="5" fill="#f59e0b"/>
      <text x="34" y="22" class="tag-text" fill="#cbd5e1">GAAP / IFRS Compliance</text>
    </g>
  </g>

  <!-- Decorative Balance / Ledger Icon in Upper Center -->
  <g transform="translate(560, 42)">
    <rect width="80" height="80" rx="22" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <!-- Scales / Ledger Graphic -->
    <path d="M 600 58 L 600 102 M 580 72 L 620 72 M 575 72 L 568 88 A 12 6 0 0 0 592 88 Z M 625 72 L 618 88 A 12 6 0 0 0 642 88 Z" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- FOREGROUND: Titles and Subtitles (Completely Clear and Unobscured) -->
  <!-- Top Category Kicker -->
  <text x="600" y="156" text-anchor="middle" class="tag-text" letter-spacing="3" fill="#10b981">
    CURATED ECOSYSTEM &amp; BENCHMARKS
  </text>

  <!-- Main Title -->
  <text x="600" y="210" text-anchor="middle" class="title-text" font-size="44">
    Financial General Ledger &amp; Accounting Journal
  </text>

  <!-- Subtitle Line 1 -->
  <text x="600" y="254" text-anchor="middle" class="subtitle-text" font-size="20">
    Top SaaS Platforms, Open-Source Bookkeeping Engines &amp; Double-Entry Ledgers
  </text>

  <!-- Subtitle Line 2 / Meta -->
  <text x="600" y="288" text-anchor="middle" class="subtitle-text code-font" font-size="14" fill="#64748b">
    ERPNext • Odoo • QuickBooks • NetSuite • GnuCash • LedgerSMB • Beancount • dubbl
  </text>

  <!-- Bottom Accent Gradient Line -->
  <rect x="350" y="320" width="500" height="3" rx="1.5" fill="url(#accentGrad)"/>
</svg>
